# This is a Databricks asset bundle definition for sales_streaming_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sales_streaming_analytics
  uuid: a1a04888-d65f-430b-8ff0-5955a4bc4c9a

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog: # this is a variable name
    default: sales_streaming_dev
  checkpoints_dir:
    default: dev_checkpoints
  ngrokip:
    default: 15566
  env:
    default: dev

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405611651926080.0.azuredatabricks.net/
    variables:
      catalog:
        default: sales_streaming_dev
      env:
        default: dev
    presets:
      artifacts_dynamic_version: true
      name_prefix: "dev_${workspace.current_user.short_name}_"

  test:
    mode: development
    workspace:
      host: https://adb-7405611651926080.0.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/saiadabala@jayveer.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/saiadabala@jayveer.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: sales_streaming_test
      checkpoints_dir:
        default: test_checkpoints
      env:
        default: test
    presets:
      artifacts_dynamic_version: true
      name_prefix: "test_${workspace.current_user.short_name}_"
    permissions:
      - user_name: saiadabala@jayveer.onmicrosoft.com
        level: CAN_MANAGE  

  prod:
    mode: production
    workspace:
      host: https://adb-7405612441814477.17.azuredatabricks.net/
      # We explicitly deploy to /Workspace/Users/saiadabala@jayveer.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/saiadabala@jayveer.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: sales_streaming_prod
      checkpoints_dir:
        default: prod_checkpoints
      env:
        default: prod
    presets:
      artifacts_dynamic_version: true
      name_prefix: "prod_"
    permissions:
      - user_name: saiadabala@jayveer.onmicrosoft.com
        level: CAN_MANAGE
