resources:
  jobs:
    streaming_ETL_job:
      name: streaming_ETL_job
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: HOURS
      tasks:
        - task_key: brz_read_task
          notebook_task:
            notebook_path: ..\..\medallion_arc\bronze\stream_read.ipynb
            base_parameters:
              catalog: ${var.catalog}
            source: WORKSPACE
          job_cluster_key: slv_task_cluster
        - task_key: slv_sales_task
          depends_on:
            - task_key: brz_read_task
          notebook_task:
            notebook_path: ..\..\medallion_arc\silver\sales_slv_notebook.ipynb
            base_parameters:
              catalog: ${var.catalog}
            source: WORKSPACE
          job_cluster_key: slv_task_cluster      
      job_clusters:
        - job_cluster_key: slv_task_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_D4ds_v4
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3
            data_security_mode: DATA_SECURITY_MODE_STANDARD
            runtime_engine: PHOTON
            kind: CLASSIC_PREVIEW
            is_single_node: true
      queue:
        enabled: true